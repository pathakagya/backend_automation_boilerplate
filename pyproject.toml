[project]
name = "backend-test-automation-template"
version = "1.0.0"
description = "Shareable pytest foundation for backend API and database validation"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["venv", ".venv", "allure-report", "allure-results"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
