[pytest]
# ---------------------------------------------------------------------------
# Python path — allows "from core.xyz import ..." without src/ prefix
# ---------------------------------------------------------------------------
pythonpath = src

# ---------------------------------------------------------------------------
# Test discovery
# ---------------------------------------------------------------------------
testpaths   = tests
python_files     = test_*.py
python_classes   = Test*
python_functions = test_*

# ---------------------------------------------------------------------------
# Allure
# ---------------------------------------------------------------------------
addopts =
    --alluredir=allure-results
    --clean-alluredir
    --dist=loadscope
    -ra
    -q

timeout = 120
timeout_method = thread

# ---------------------------------------------------------------------------
# Markers (also registered in src/conftest.py::pytest_configure)
# ---------------------------------------------------------------------------
markers =
    integration: tests that require DB or API connectivity
    e2e:         end-to-end multi-step workflow tests
    smoke:       critical-path subset run before full suite
