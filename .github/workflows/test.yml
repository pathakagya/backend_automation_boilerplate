name: backend-tests

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  api-smoke:
    name: API smoke and collection (Python ${{ matrix.python-version }})
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
      fail-fast: false
    env:
      HAS_API_URL: ${{ secrets.API_BASE_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Validate Python sources
        run: python -m compileall -q src tests
      - name: Collect API-only smoke tests
        run: pytest tests/smoke -m "smoke and not db_required" --collect-only -ra
        env:
          ENV: dev
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          API_AUTH_TYPE: ${{ vars.API_AUTH_TYPE || 'none' }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
      - name: Run API-only smoke tests
        if: env.HAS_API_URL == 'true'
        run: pytest tests/smoke -m "smoke and not db_required" --junitxml=junit-smoke.xml -ra
        env:
          ENV: dev
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          API_AUTH_TYPE: ${{ vars.API_AUTH_TYPE || 'none' }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
      # No pytest runs may follow the real smoke run: pytest.ini adds --clean-alluredir,
      # which would wipe allure-results/ before the upload below.
      - uses: actions/upload-artifact@v4
        if: always() && matrix.python-version == '3.12'
        with:
          name: junit-smoke
          path: junit-smoke.xml
      - uses: actions/upload-artifact@v4
        if: always() && matrix.python-version == '3.12'
        with:
          name: allure-results-smoke
          path: allure-results/
          retention-days: 1

  db-tests:
    name: DB-backed tests
    if: ${{ vars.RUN_DB_TESTS == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Install DB driver
        if: vars.DB_DRIVER != ''
        run: pip install "${{ vars.DB_DRIVER }}"
      - name: Run DB-backed tiers
        run: >
          pytest tests/integration tests/e2e
          -m "integration or e2e"
          --junitxml=junit-db.xml -ra
        env:
          ENV: dev
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          API_AUTH_TYPE: ${{ vars.API_AUTH_TYPE || 'none' }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
          DB_ADAPTER_CLASS: ${{ secrets.DB_ADAPTER_CLASS }}
          DB_ENGINE: ${{ vars.DB_ENGINE }}
          DATABASE_HOST: ${{ secrets.DATABASE_HOST }}
          DATABASE_PORT: ${{ secrets.DATABASE_PORT }}
          DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
          DATABASE_USER: ${{ secrets.DATABASE_USER }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-db
          path: junit-db.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-db
          path: allure-results/
          retention-days: 1

  publish-report:
    name: Publish Allure report
    runs-on: ubuntu-latest
    needs: [api-smoke, db-tests]
    if: always()
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Download smoke results
        uses: actions/download-artifact@v4
        with:
          name: allure-results-smoke
          path: allure-results/
        continue-on-error: true
      - name: Download DB results
        uses: actions/download-artifact@v4
        with:
          name: allure-results-db
          path: allure-results/
        continue-on-error: true
      - name: Install Allure CLI
        run: |
          curl -sLo allure.tgz \
            https://github.com/allure-framework/allure2/releases/download/2.29.0/allure-2.29.0.tgz
          tar -xzf allure.tgz
          echo "$PWD/allure-2.29.0/bin" >> $GITHUB_PATH
      - name: Generate HTML report
        run: allure generate allure-results --clean -o allure-report
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report/
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

  notify:
    name: Email notification
    runs-on: ubuntu-latest
    needs: [publish-report]
    if: always() && vars.NOTIFY_EMAIL != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jinja2
      - name: Download allure results (smoke)
        uses: actions/download-artifact@v4
        with:
          name: allure-results-smoke
          path: allure-results/
        continue-on-error: true
      - name: Download allure results (db)
        uses: actions/download-artifact@v4
        with:
          name: allure-results-db
          path: allure-results/
        continue-on-error: true
      - name: Download JUnit fallback
        uses: actions/download-artifact@v4
        with:
          name: junit-smoke
          path: .
        continue-on-error: true
      - name: Generate email report
        run: python scripts/generate_email_report.py
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          ALLURE_REPORT_URL: ${{ needs.publish-report.outputs.page_url }}
      - name: Send email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ vars.MAIL_SMTP_HOST || 'smtp.gmail.com' }}
          server_port: ${{ vars.MAIL_SMTP_PORT || 465 }}
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "[${{ env.EMAIL_STATUS }}] Test Report — ${{ github.ref_name }} #${{ github.run_number }}"
          to: ${{ vars.NOTIFY_EMAIL }}
          from: ${{ secrets.MAIL_USERNAME }}
          html_body: file://email_body.html
